<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="container">
  <h2>Создание заказа</h2>

  <form id="orderForm">
    <input type="text" placeholder="Адрес" required />
    <input type="text" placeholder="Цена" required />
    <input type="text" placeholder="Получатель" required />
    <button type="submit">Создать</button>
  </form>

  <div id="orderActions" class="hidden">
    <button data-status="paid">Заказ оплачен</button>
    <button data-status="sent">Заказ отправлен</button>
    <button data-status="received">Заказ получен</button>
  </div>
</div>

<div id="notifications"></div>

<script src="js/script.js"></script>
</body>
</html>
