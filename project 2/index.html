<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма заказа</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="form-container">
  <form id="orderForm">
    <h2>Создать заказ</h2>
    <input type="text" placeholder="Адрес" required>
    <input type="text" placeholder="Цена" required>
    <input type="text" placeholder="Получатель" required>
    <button type="submit">Создать заказ</button>
  </form>
</div>

<div class="order-status" id="orderStatus">
  <button data-action="paid">Заказ оплачен</button>
  <button data-action="sent">Заказ отправлен</button>
  <button data-action="received">Заказ получен</button>
</div>

<div id="notifications"></div>

<script src="js/script.js"></script>
</body>
</html>
